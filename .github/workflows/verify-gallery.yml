name: Verify EventBoard screenshot gallery
on:
  workflow_dispatch:
  push:
    branches: [fix/eventboard-gallery, main]
    paths: [index.html, app/page.tsx, app/globals.css, scripts/verify-eventboard-gallery.cjs, .github/workflows/verify-gallery.yml]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --prefix "$RUNNER_TEMP/gallery-check" @playwright/test@1.56.0
      - run: node "$RUNNER_TEMP/gallery-check/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Check compact layout and real touch swipe
        run: GALLERY_PLAYWRIGHT_MODULE="$RUNNER_TEMP/gallery-check/node_modules/@playwright/test" node scripts/verify-eventboard-gallery.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eventboard-gallery-preview
          path: gallery-evidence
          retention-days: 14
